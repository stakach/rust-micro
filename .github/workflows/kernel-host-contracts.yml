name: Kernel host contracts

on:
  push:
    paths:
      - ".github/workflows/kernel-host-contracts.yml"
      - "src/smp.rs"
      - "src/smp/bkl.rs"
      - "src/smp/bkl_cpu_tests.rs"
      - "src/smp/quiescence.rs"
      - "tests/bkl_contracts.rs"
      - "src/arch/x86_64/syscall_entry.rs"
      - "src/arch/x86_64/cpu_exception_vectors.rs"
      - "tests/cpu_exception_vectors.rs"
      - "src/arch/x86_64/iommu/retirement.rs"
      - "tests/vtd_retirement.rs"
      - "src/idle_log_budget.rs"
      - "tests/idle_log_budget.rs"
      - "src/arch/x86_64/exceptions.rs"
      - "src/arch/x86_64/ioapic.rs"
      - "src/arch/x86_64/paging.rs"
      - "src/boot.rs"
      - "src/boot/**"
      - "src/simpleboot.rs"
      - "src/rootserver.rs"
      - "src/main.rs"
      - "src/endpoint.rs"
      - "src/invocation/reply_binding.rs"
      - "src/invocation/passive_worker_unbind_specs.rs"
      - "crates/sel4-rt/src/reply_binding.rs"
      - "tests/boot_mmap_reader_source.rs"
      - "tests/direct_map_*.rs"
      - "tests/ioapic_preflight_source.rs"
      - "tests/lapic_preflight_source.rs"
      - "tests/simpleboot_mmap_policy.rs"
      - "tests/simpleboot_tag_walk.rs"
  pull_request:
    paths:
      - ".github/workflows/kernel-host-contracts.yml"
      - "src/smp.rs"
      - "src/smp/bkl.rs"
      - "src/smp/bkl_cpu_tests.rs"
      - "src/smp/quiescence.rs"
      - "tests/bkl_contracts.rs"
      - "src/arch/x86_64/syscall_entry.rs"
      - "src/arch/x86_64/cpu_exception_vectors.rs"
      - "tests/cpu_exception_vectors.rs"
      - "src/arch/x86_64/iommu/retirement.rs"
      - "tests/vtd_retirement.rs"
      - "src/idle_log_budget.rs"
      - "tests/idle_log_budget.rs"
      - "src/arch/x86_64/exceptions.rs"
      - "src/arch/x86_64/ioapic.rs"
      - "src/arch/x86_64/paging.rs"
      - "src/boot.rs"
      - "src/boot/**"
      - "src/simpleboot.rs"
      - "src/rootserver.rs"
      - "src/main.rs"
      - "src/endpoint.rs"
      - "src/invocation/reply_binding.rs"
      - "src/invocation/passive_worker_unbind_specs.rs"
      - "crates/sel4-rt/src/reply_binding.rs"
      - "tests/boot_mmap_reader_source.rs"
      - "tests/direct_map_*.rs"
      - "tests/ioapic_preflight_source.rs"
      - "tests/lapic_preflight_source.rs"
      - "tests/simpleboot_mmap_policy.rs"
      - "tests/simpleboot_tag_walk.rs"

permissions:
  contents: read

jobs:
  ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test exact Reply offer response decoding
        run: |
          rustc --edition 2021 --test crates/sel4-rt/src/reply_binding.rs -o /tmp/reply-binding-tests
          /tmp/reply-binding-tests
      - name: Test the native BKL ownership module
        run: |
          rustc --edition 2021 --test tests/bkl_contracts.rs -o /tmp/kernel-bkl-tests
          /tmp/kernel-bkl-tests
      - name: Test the CPU exception vector routing
        run: |
          rustc --edition 2021 --test tests/cpu_exception_vectors.rs -o /tmp/kernel-cpu-exception-vector-tests
          /tmp/kernel-cpu-exception-vector-tests
      - name: Test the idle-tag log budget
        run: |
          rustc --edition 2021 --test tests/idle_log_budget.rs -o /tmp/kernel-idle-log-budget-tests
          /tmp/kernel-idle-log-budget-tests
      - name: Test the VT-d retirement ordering
        run: |
          rustc --edition 2021 --test tests/vtd_retirement.rs -o /tmp/kernel-vtd-retirement-tests
          /tmp/kernel-vtd-retirement-tests
      - name: Test boot map and first-install direct-map preflight
        run: |
          for spec in tests/direct_map_policy.rs tests/direct_map_owners.rs \
            tests/simpleboot_mmap_policy.rs tests/boot_mmap_reader_source.rs \
            tests/ioapic_preflight_source.rs tests/lapic_preflight_source.rs \
            tests/direct_map_preflight_source.rs tests/direct_map_runtime_builder_source.rs \
            tests/simpleboot_tag_walk.rs; do
            bin="/tmp/$(basename "$spec" .rs)-tests"
            rustc --edition 2021 --test -Awarnings "$spec" -o "$bin"
            "$bin"
          done
